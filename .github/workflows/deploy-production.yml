name: Deploy production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Immutable commit SHA or protected release tag to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: eikon-mind-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    defaults:
      run:
        working-directory: frontend
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TERRAFORM_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Resolve and verify immutable deployment ref
        run: |
          requested_ref='${{ inputs.ref }}'
          resolved_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          if [[ "$requested_ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
            test "${resolved_sha,,}" = "${requested_ref,,}"
          elif [[ "$requested_ref" == refs/tags/release-* ]]; then
            test "$(git -C "$GITHUB_WORKSPACE" rev-parse "$requested_ref^{commit}")" = "$resolved_sha"
          else
            echo "Only a full 40-character commit SHA or refs/tags/release-* is deployable." >&2
            exit 1
          fi
          echo "DEPLOYMENT_SHA=$resolved_sha" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 10
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.8
      - name: Apply approved production infrastructure
        working-directory: infra/terraform/env/production
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve
          terraform output -json > "$GITHUB_WORKSPACE/deployment.json"
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check && pnpm lint && pnpm typecheck && pnpm test:unit && pnpm security:audit && pnpm cf:build
      - name: Render production configuration
        run: node scripts/render-wrangler-config.mjs production "$GITHUB_WORKSPACE/deployment.json"
      - name: Apply backwards-compatible D1 migrations
        run: pnpm exec wrangler d1 migrations apply eikon-mind-production --remote --config .wrangler/generated/production/wrangler.jsonc
      - name: Upload, then promote reviewed versions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
        run: |
          pnpm exec wrangler versions upload --config .wrangler/generated/production/wrangler.jsonc --tag "$DEPLOYMENT_SHA" --message "production $DEPLOYMENT_SHA"
          pnpm exec wrangler versions deploy --config .wrangler/generated/production/wrangler.jsonc --version-tag "$DEPLOYMENT_SHA" --percentage 100 --message "production $DEPLOYMENT_SHA"
          pnpm exec wrangler triggers deploy --config .wrangler/generated/production/wrangler.jsonc
          pnpm exec wrangler versions upload --config .wrangler/generated/production/wrangler-maintenance.jsonc --tag "$DEPLOYMENT_SHA" --message "production maintenance $DEPLOYMENT_SHA"
          pnpm exec wrangler versions deploy --config .wrangler/generated/production/wrangler-maintenance.jsonc --version-tag "$DEPLOYMENT_SHA" --percentage 100 --message "production maintenance $DEPLOYMENT_SHA"
          pnpm exec wrangler triggers deploy --config .wrangler/generated/production/wrangler-maintenance.jsonc
      - name: HTTPS smoke test
        run: curl --fail --silent --show-error --max-time 15 "https://$(jq -r '.deployment.value.hostname' "$GITHUB_WORKSPACE/deployment.json")/"
