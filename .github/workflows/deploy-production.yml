name: Deploy production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Immutable commit SHA or protected release tag to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: eikon-mind-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    defaults:
      run:
        working-directory: frontend
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TERRAFORM_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Reject mutable branch names
        run: |
          git -C "$GITHUB_WORKSPACE" rev-parse --verify "${{ inputs.ref }}^{commit}"
          test "${{ inputs.ref }}" != "main"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - name: Apply approved production infrastructure
        working-directory: infra/terraform/env/production
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve
          terraform output -json > "$GITHUB_WORKSPACE/deployment.json"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm test && pnpm cf:build
      - name: Render production configuration
        run: node scripts/render-wrangler-config.mjs production "$GITHUB_WORKSPACE/deployment.json"
      - name: Apply backwards-compatible D1 migrations
        run: pnpm exec wrangler d1 migrations apply eikon-mind-production --remote --config .wrangler/generated/production/wrangler.jsonc
      - name: Upload, then promote reviewed versions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
        run: |
          pnpm exec wrangler versions upload --config .wrangler/generated/production/wrangler.jsonc --tag "$GITHUB_SHA" --message "production $GITHUB_SHA"
          pnpm exec wrangler versions deploy --config .wrangler/generated/production/wrangler.jsonc --version-tag "$GITHUB_SHA" --percentage 100 --message "production $GITHUB_SHA"
          pnpm exec wrangler triggers deploy --config .wrangler/generated/production/wrangler.jsonc
          pnpm exec wrangler versions upload --config .wrangler/generated/production/wrangler-maintenance.jsonc --tag "$GITHUB_SHA" --message "production maintenance $GITHUB_SHA"
          pnpm exec wrangler versions deploy --config .wrangler/generated/production/wrangler-maintenance.jsonc --version-tag "$GITHUB_SHA" --percentage 100 --message "production maintenance $GITHUB_SHA"
          pnpm exec wrangler triggers deploy --config .wrangler/generated/production/wrangler-maintenance.jsonc
      - name: HTTPS smoke test
        run: curl --fail --silent --show-error --max-time 15 "https://$(jq -r '.deployment.value.hostname' "$GITHUB_WORKSPACE/deployment.json")/"
