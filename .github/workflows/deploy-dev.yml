name: Deploy development

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Provision only, or provision and deploy the application.
        required: true
        default: bootstrap
        type: choice
        options: [bootstrap, deploy]

permissions:
  contents: read

concurrency:
  group: eikon-mind-development
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: development
    defaults:
      run:
        working-directory: frontend
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TERRAFORM_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
      - uses: ./.github/actions/verify-lfs
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10
      - name: Create pnpm store directory
        run: mkdir -p "$(pnpm store path)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.8
      - name: Configure Cloudflare credential in the remote HCP workspace
        env:
          TF_CLOUD_ORGANIZATION: eikon-mind
          HCP_TERRAFORM_WORKSPACE: eikon-mind-dev
          HCP_TERRAFORM_WORKING_DIRECTORY: infra/terraform/env/dev
          HCP_TERRAFORM_TOKEN: ${{ secrets.TF_API_TOKEN }}
          CLOUDFLARE_PROVIDER_TOKEN: ${{ secrets.CLOUDFLARE_TERRAFORM_API_TOKEN }}
        run: node "$GITHUB_WORKSPACE/.github/scripts/configure-hcp-workspace.mjs"
      - name: Apply approved development infrastructure
        working-directory: infra/terraform/env/dev
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve
          terraform output -json > "$GITHUB_WORKSPACE/deployment.json"
      - name: Report development bootstrap identifiers
        run: |
          secrets_store_id="$(jq -r '.deployment.value.secrets_store_id' "$GITHUB_WORKSPACE/deployment.json")"
          echo "Secrets Store ID: $secrets_store_id"
          echo "Secrets Store ID: \`$secrets_store_id\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Check development Secret Store readiness
        id: secret_store
        run: node "$GITHUB_WORKSPACE/.github/scripts/check-dev-secret-store.mjs" "$GITHUB_WORKSPACE/deployment.json"
      - name: Publish bootstrap deployment details
        if: (github.event_name == 'workflow_dispatch' && inputs.operation == 'bootstrap') || steps.secret_store.outputs.ready != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: development-bootstrap-${{ github.sha }}
          path: deployment.json
          if-no-files-found: error
          retention-days: 1
      - name: Report development bootstrap status
        if: steps.secret_store.outputs.ready != 'true'
        run: |
          echo "## Development infrastructure is ready" >> "$GITHUB_STEP_SUMMARY"
          echo "Add the missing Secrets Store names, then run this workflow with operation=deploy." >> "$GITHUB_STEP_SUMMARY"
          echo "Missing names: ${{ steps.secret_store.outputs.missing }}" >> "$GITHUB_STEP_SUMMARY"
      - if: steps.secret_store.outputs.ready == 'true' && (github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy')
        run: pnpm install --frozen-lockfile
      - if: steps.secret_store.outputs.ready == 'true' && (github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy')
        run: pnpm format:check && pnpm lint && pnpm typecheck && pnpm test:unit && pnpm security:audit && pnpm cf:build
      - name: Render environment configuration
        if: steps.secret_store.outputs.ready == 'true' && (github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy')
        run: node scripts/render-wrangler-config.mjs dev "$GITHUB_WORKSPACE/deployment.json"
      - name: Apply compatible D1 migrations
        if: steps.secret_store.outputs.ready == 'true' && (github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
        run: pnpm exec wrangler d1 migrations apply eikon-mind-dev --remote --config .wrangler/generated/dev/wrangler.jsonc
      - name: Upload and promote application and maintenance versions
        if: steps.secret_store.outputs.ready == 'true' && (github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
        run: |
          deploy_worker() {
            local config="$1"
            local tag="$2"
            local message="$3"
            local upload_log="$4"

            if pnpm exec wrangler versions upload --config "$config" --tag "$tag" --message "$message" >"$upload_log" 2>&1; then
              cat "$upload_log"
              pnpm exec wrangler versions deploy --config "$config" --version-tag "$tag" --percentage 100 --message "$message"
            elif grep -Fq "Worker that does not yet exist" "$upload_log"; then
              cat "$upload_log"
              pnpm exec wrangler deploy --config "$config" --tag "$tag" --message "$message"
            else
              cat "$upload_log"
              return 1
            fi

            pnpm exec wrangler triggers deploy --config "$config"
          }

          deploy_worker .wrangler/generated/dev/wrangler.jsonc "$GITHUB_SHA" "development $GITHUB_SHA" "$RUNNER_TEMP/development-worker-upload.log"
          deploy_worker .wrangler/generated/dev/wrangler-maintenance.jsonc "$GITHUB_SHA" "development maintenance $GITHUB_SHA" "$RUNNER_TEMP/development-maintenance-worker-upload.log"
      - name: Development application, database, and maintenance smoke tests
        if: steps.secret_store.outputs.ready == 'true' && (github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
        run: |
          database_health="$(pnpm exec wrangler d1 execute eikon-mind-dev --remote --command 'SELECT 1 AS healthy' --json --config .wrangler/generated/dev/wrangler.jsonc)"
          echo "$database_health" | jq -e 'any(.. | objects; .healthy == 1)'
          hostname="$(jq -r '.deployment.value.hostname' "$GITHUB_WORKSPACE/deployment.json")"
          account_id="$(jq -r '.deployment.value.account_id' "$GITHUB_WORKSPACE/deployment.json")"
          worker_name="$(jq -r '.deployment.value.worker_name' "$GITHUB_WORKSPACE/deployment.json")"
          node scripts/smoke-production.mjs "https://$hostname" "$account_id" "$worker_name-maintenance"
