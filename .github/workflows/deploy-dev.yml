name: Deploy development

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: eikon-mind-development
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: development
    defaults:
      run:
        working-directory: frontend
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TERRAFORM_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
      - uses: ./.github/actions/verify-lfs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 10
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.8
      - name: Apply approved development infrastructure
        working-directory: infra/terraform/env/dev
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve
          terraform output -json > "$GITHUB_WORKSPACE/deployment.json"
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check && pnpm lint && pnpm typecheck && pnpm test:unit && pnpm security:audit && pnpm cf:build
      - name: Render environment configuration
        run: node scripts/render-wrangler-config.mjs dev "$GITHUB_WORKSPACE/deployment.json"
      - name: Apply compatible D1 migrations
        run: pnpm exec wrangler d1 migrations apply eikon-mind-dev --remote --config .wrangler/generated/dev/wrangler.jsonc
      - name: Upload and promote application and maintenance versions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
        run: |
          pnpm exec wrangler versions upload --config .wrangler/generated/dev/wrangler.jsonc --tag "$GITHUB_SHA" --message "development $GITHUB_SHA"
          pnpm exec wrangler versions deploy --config .wrangler/generated/dev/wrangler.jsonc --version-tag "$GITHUB_SHA" --percentage 100 --message "development $GITHUB_SHA"
          pnpm exec wrangler triggers deploy --config .wrangler/generated/dev/wrangler.jsonc
          pnpm exec wrangler versions upload --config .wrangler/generated/dev/wrangler-maintenance.jsonc --tag "$GITHUB_SHA" --message "development maintenance $GITHUB_SHA"
          pnpm exec wrangler versions deploy --config .wrangler/generated/dev/wrangler-maintenance.jsonc --version-tag "$GITHUB_SHA" --percentage 100 --message "development maintenance $GITHUB_SHA"
          pnpm exec wrangler triggers deploy --config .wrangler/generated/dev/wrangler-maintenance.jsonc
      - name: HTTPS smoke test
        run: curl --fail --silent --show-error --max-time 15 "https://$(jq -r '.deployment.value.hostname' "$GITHUB_WORKSPACE/deployment.json")/"
